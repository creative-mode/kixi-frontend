name: Notas de versão

# Cada publicação em PRD gera uma GitHub Release com as notas dos PRs fundidos desde a anterior
# (agrupadas por tipo em .github/release.yml). A etiqueta é a data e o commit: v2026.11.24-1a2b3c4.
on:
  push:
    branches: [PRD]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Criar a release
    runs-on: ubuntu-latest
    # Um disparo manual noutra branch não cria uma release de produção.
    if: github.ref == 'refs/heads/PRD'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Criar a release com as notas geradas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release $tag já existe."
            exit 0
          fi
          anterior="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -n "$anterior" ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes --notes-start-tag "$anterior" --latest
          else
            # A primeira release não lista o histórico inteiro: as seguintes listam os PRs desde esta.
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --latest \
              --notes "Primeira versão com notas. As próximas listam os PRs fundidos desde esta."
          fi

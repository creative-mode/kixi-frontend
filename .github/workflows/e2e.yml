name: QA end-to-end

on:
  pull_request:
    branches: [DEV]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [QUA]

permissions:
  contents: read

jobs:
  journeys:
    name: 'Playwright: jornadas críticas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          JWT_SECRET: e2e-ci-secret-that-is-at-least-32-characters-long
          KIXI_MOCK: 'true'
          KIXI_ALLOW_MOCK_IN_PROD: 'true'
          E2E_ADMIN_USERNAME: admin@kixi.ao
          E2E_TEACHER_USERNAME: professor@kixi.ao
          E2E_PASSWORD: Kixi1234!
      - name: Anexar relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

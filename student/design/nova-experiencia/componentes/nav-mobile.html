.nt .on{display:none}
.nt[aria-current="page"]{color:#1f5a2c;font-weight:700}

.nt[aria-current="page"] .on{display:block}
.nt:focus-visible{outline:2px solid #1f5a2c;outline-offset:-2px;border-radius:10px}
@media (prefers-reduced-motion: no-preference){.nt[aria-current="page"] .on{animation:pop .22s ease-out}}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}

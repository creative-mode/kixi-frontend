<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escolher a escola</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>

body{margin:0}
a{color:#1f5a2c}a:hover{color:#2a7a3c}
input.vh{position:absolute;opacity:0;pointer-events:none}
.opt{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 14px;border-radius:16px;border:1.5px solid #e6e9e3;cursor:pointer}
.opt:has(input:checked){border-color:#1f5a2c;background:#f3f8f0}
.opt:has(input:focus-visible){outline:2px solid #121c15;outline-offset:2px}
.radio{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:2px solid #b9c4b5;box-sizing:border-box}
.opt:has(input:checked) .radio{border-color:#1f5a2c;border-width:6px}
.logo{flex-shrink:0;width:40px;height:40px;border-radius:11px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.mut{font-size:13px;color:#5f6b63}

</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #121c15; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden;">

  <header style="display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px;">
    <a href="../cadastro/mobile.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #121c15;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex: 1; display: flex; gap: 6px;" role="img" aria-label="Passo 1 de 3"><span style="flex: 1; height: 4px; border-radius: 999px; background: #1f5a2c;"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #e6e9e3;"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #e6e9e3;"></span></div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 12px 20px; overflow: hidden;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em;">Em que escola estudas?</h1>
      <span style="font-size: 15px; color: #5f6b63;">Mostramos-te primeiro os enunciados e a turma da tua escola. Depois podes explorar as outras.</span>
    </div>
    <label for="q-escola" style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 14px; background: #f5f6f4; color: #5f6b63;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Pesquisar escola</span>
      <input id="q-escola" type="search" value="Instituto" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 16px; color: #121c15; outline: none;">
    </label>
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
      <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Escolas encontradas</legend>
      <label class="opt"><input class="vh" type="radio" name="escola" checked><span class="logo" style="background: #1f5a2c; color: #ffffff;">ITEL</span><span style="flex: 1; display: flex; flex-direction: column;"><strong style="font-size: 15px;">Instituto de Telecomunicações</strong><span class="mut">Luanda, Rangel</span></span><span class="radio"></span></label>
      <label class="opt"><input class="vh" type="radio" name="escola"><span class="logo" style="background: #121c15; color: #ffffff;">ITK</span><span style="flex: 1; display: flex; flex-direction: column;"><strong style="font-size: 15px;">Instituto Técnico Kianda</strong><span class="mut">Luanda, Talatona</span></span><span class="radio"></span></label>
      <label class="opt"><input class="vh" type="radio" name="escola"><span class="logo" style="background: #fbf1d6; color: #4d3300;">IPB</span><span style="flex: 1; display: flex; flex-direction: column;"><strong style="font-size: 15px;">Instituto Politécnico de Benguela</strong><span class="mut">Benguela</span></span><span class="radio"></span></label>
    </fieldset>
    <span class="mut">Não encontras a tua escola? <a href="../onboarding/mobile.html" style="font-weight: 700; text-decoration: none;">Pede para a juntarmos</a></span>
  </main>

  <div style="padding: 12px 20px 24px;">
    <a href="../inicio/mobile.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #1f5a2c; color: #ffffff; font-weight: 700; font-size: 16px; text-decoration: none;">Continuar</a>
  </div>
</div>
</body>
</html>

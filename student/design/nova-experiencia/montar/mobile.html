<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montar simulação</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>

body{margin:0}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.rola{overflow-y:auto;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 28px),transparent 100%)}
a{color:#1f5a2c}a:hover{color:#2a7a3c}
button{font:inherit;cursor:pointer}
input.vh{position:absolute;opacity:0;pointer-events:none}
.tema{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid #edf1ea;cursor:pointer}
.caixa{flex-shrink:0;width:22px;height:22px;border-radius:7px;border:2px solid #b9c4b5;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.tema:has(input:checked) .caixa{background:#1f5a2c;border-color:#1f5a2c}
.tema:has(input:checked) .caixa svg{opacity:1}
.caixa svg{opacity:0}
.tema:has(input:focus-visible){outline:2px solid #121c15;outline-offset:2px;border-radius:8px}
.seg{display:grid;gap:4px;padding:4px;border-radius:12px;background:#edf1ea}
.seg label{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:9px;font-size:14px;font-weight:600;color:#3d4a41;cursor:pointer;text-align:center;padding:0 6px}
.seg label:has(input:checked){background:#ffffff;color:#121c15;font-weight:700;box-shadow:0 1px 2px rgba(18,28,21,.1)}
.seg label:has(input:focus-visible){outline:2px solid #121c15;outline-offset:1px}
.q{font-size:14px;font-weight:700;margin:0 0 8px}

</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #8a948c; color: #121c15; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden;">

  <div aria-hidden="true" style="position: absolute; inset: 0; background: #f2f5f0; opacity: .35;"></div>

  <form role="dialog" aria-modal="true" aria-labelledby="titulo-montar" style="position: absolute; left: 0; right: 0; bottom: 0; top: 96px; display: flex; flex-direction: column; background: #ffffff; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 30px rgba(18,28,21,.18);">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #d3dbcf; margin-top: 8px;"></span>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 0 20px;">
      <h1 id="titulo-montar" style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em;">Treino de Física</h1>
      <a href="../provas/mobile.html" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #3d4a41;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
    </div>

    <div class="rola" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; padding: 10px 20px 16px;">
      <fieldset style="border: 0; margin: 0; padding: 0;">
        <legend class="q">Temas</legend>
        <label class="tema" style="border-top: 0;"><input class="vh" type="checkbox" checked><span class="caixa"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span><span style="flex: 1; font-size: 15px; font-weight: 600;">Lei de Ohm</span><span style="font-size: 12px; font-weight: 600; color: #c2383e;">A rever</span></label>
        <label class="tema"><input class="vh" type="checkbox"><span class="caixa"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span><span style="flex: 1; font-size: 15px;">Potência eléctrica</span><span style="font-size: 12px; color: #617066;">A aprender</span></label>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0;">
        <legend class="q">Questões</legend>
        <div class="seg" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
          <label><input class="vh" type="radio" name="n">5</label>
          <label><input class="vh" type="radio" name="n" checked>10</label>
          <label><input class="vh" type="radio" name="n">20</label>
        </div>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0;">
        <legend class="q">Correção</legend>
        <div class="seg" style="grid-template-columns: repeat(2, minmax(0, 1fr));">
          <label><input class="vh" type="radio" name="c" checked>A cada questão</label>
          <label><input class="vh" type="radio" name="c">Só no fim</label>
        </div>
        <p style="margin: 8px 0 0; font-size: 13px; color: #617066; line-height: 1.45;">Vês logo se acertaste e porquê.</p>
      </fieldset>

      <details style="border-top: 1px solid #edf1ea; padding-top: 4px;">
        <summary style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #3d4a41; cursor: pointer;">Mais opções: tempo e tipo de questões</summary>
      </details>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 18px; border-top: 1px solid #edf1ea;">
      <span style="font-size: 14px; color: #3d4a41; text-align: center;">10 questões de Lei de Ohm, cerca de 20 minutos</span>
      <a href="../prova/mobile.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #1f5a2c; color: #ffffff; font-weight: 700; font-size: 16px; text-decoration: none;">Começar</a>
    </div>
  </form>
</div>
</body>
</html>

<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montar simulação, computador</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>

body{margin:0;background:#ffffff}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
a{color:#1f5a2c}a:hover{color:#2a7a3c}
button{font:inherit;cursor:pointer}
input.vh{position:absolute;opacity:0;pointer-events:none}
.tema{display:flex;align-items:center;gap:12px;min-height:54px;border-top:1px solid #edf1ea;cursor:pointer}
.caixa{flex-shrink:0;width:22px;height:22px;border-radius:7px;border:2px solid #b9c4b5;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.tema:has(input:checked) .caixa{background:#1f5a2c;border-color:#1f5a2c}
.tema:has(input:checked) .caixa svg{opacity:1}
.caixa svg{opacity:0}
.seg{display:grid;gap:4px;padding:4px;border-radius:12px;background:#edf1ea}
.seg label{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:9px;font-size:14px;font-weight:600;color:#3d4a41;cursor:pointer;text-align:center;padding:0 6px}
.seg label:has(input:checked){background:#ffffff;color:#121c15;font-weight:700;box-shadow:0 1px 2px rgba(18,28,21,.1)}
.q{font-size:14px;font-weight:700;margin:0 0 8px}


body{margin:0}
.nav-item{display:flex;align-items:center;gap:14px;height:46px;padding:0 14px;border-radius:12px;color:#3d4a41;text-decoration:none;font-weight:600;font-size:15px}
.nav-item:hover{background:#f5f6f4;color:#121c15}
.nav-item[aria-current="page"]{background:#f1f6ee;color:#1f5a2c;font-weight:700}
.nav-item .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#c2383e;flex-shrink:0}

</style>
</head>
<body>
<div style="box-sizing: border-box; min-height: 1000px; max-width: 1440px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: flex-start; background: #ffffff; color: #121c15; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">

  <aside style="box-sizing: border-box; width: 232px; display: flex; flex-direction: column; gap: 28px; padding: 28px 16px; min-height: 1000px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
  <a href="../inicio/desktop.html" aria-label="Kixi, início" style="display: flex; align-items: center; padding: 4px 0 4px 14px;">
    <svg viewBox="0 0 57 20" height="24" width="68" shape-rendering="crispEdges" aria-hidden="true">
      <path d="M12 0h1v1h-1zM10 1h3v1h-3zM8 2h5v1h-5zM8 3h5v1h-5zM8 4h5v1h-5zM8 5h5v1h-5zM8 6h5v1h-5zM8 7h5v1h-5zM8 8h5v1h-5zM8 9h6v1h-6zM7 10h7v1h-7zM7 11h8v1h-8zM6 12h10v1h-10zM6 13h11v1h-11zM5 14h14v1h-14zM4 15h18v1h-18zM3 16h21v1h-21zM3 17h4v1h-4zM14 17h9v1h-9zM1 18h2v1h-2zM17 18h5v1h-5zM19 19h1v1h-1z" fill="#1f5a2c"></path>
      <path transform="translate(30 6.5)" d="M0 0h2v1h-2zM4 0h2v1h-2zM7 0h6v1h-6zM14 0h2v1h-2zM18 0h2v1h-2zM21 0h6v1h-6zM0 1h2v1h-2zM3 1h2v1h-2zM9 1h2v1h-2zM14 1h2v1h-2zM18 1h2v1h-2zM23 1h2v1h-2zM0 2h4v1h-4zM9 2h2v1h-2zM15 2h4v1h-4zM23 2h2v1h-2zM0 3h3v1h-3zM9 3h2v1h-2zM16 3h2v1h-2zM23 3h2v1h-2zM0 4h4v1h-4zM9 4h2v1h-2zM15 4h4v1h-4zM23 4h2v1h-2zM0 5h2v1h-2zM3 5h2v1h-2zM9 5h2v1h-2zM14 5h2v1h-2zM18 5h2v1h-2zM23 5h2v1h-2zM0 6h2v1h-2zM4 6h2v1h-2zM7 6h6v1h-6zM14 6h2v1h-2zM18 6h2v1h-2zM21 6h6v1h-6z" fill="#121c15"></path>
    </svg>
  </a>
  <nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 2px;">
    <a class="nav-item" href="../inicio/desktop.html" aria-current="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Início</a>
    <a class="nav-item" href="../provas/desktop.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>Provas</a>
    <a class="nav-item" href="../pesquisa/desktop.html" aria-current="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg>Explorar</a>
    <a class="nav-item" href="../turma/desktop.html" aria-current="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"></path></svg>Turma</a>
    <a class="nav-item" href="../notificacoes/desktop.html" aria-current="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>Notificações<span class="dot" aria-label="2 novas"></span></a>
  </nav>
  <a href="../perfil/desktop.html" style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; text-decoration: none; color: #121c15;">
    <span style="width: 38px; height: 38px; border-radius: 50%; background: #dbe9d3; color: #1b4d27; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center;">AK</span>
    <span style="display: flex; flex-direction: column; min-width: 0;"><strong style="font-size: 14px;">Ana Kiala</strong><span style="font-size: 13px; color: #617066;">12.ª B, ITEL</span></span>
  </a>
</aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; display: flex; justify-content: center; padding: 28px 24px 48px;">
    <div style="width: 100%; max-width: 640px; display: flex; flex-direction: column;">

      <header style="display: flex; align-items: center; gap: 14px; padding: 4px 0 24px;">
        <a href="../provas/desktop.html" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #121c15;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </a>
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em;">Treino de Física</h1>
      </header>

      <div style="display: flex; flex-direction: column; gap: 24px;">
        <fieldset style="border: 0; margin: 0; padding: 0;">
          <legend class="q">Temas</legend>
          <label class="tema" style="border-top: 0;"><input class="vh" type="checkbox" checked><span class="caixa"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span><span style="flex: 1; font-size: 15px; font-weight: 600;">Lei de Ohm</span><span style="font-size: 12px; font-weight: 600; color: #c2383e;">A rever</span></label>
          <label class="tema"><input class="vh" type="checkbox"><span class="caixa"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span><span style="flex: 1; font-size: 15px;">Potência eléctrica</span><span style="font-size: 12px; color: #617066;">A aprender</span></label>
        </fieldset>

        <fieldset style="border: 0; margin: 0; padding: 0; max-width: 360px;">
          <legend class="q">Questões</legend>
          <div class="seg" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
            <label><input class="vh" type="radio" name="n">5</label>
            <label><input class="vh" type="radio" name="n" checked>10</label>
            <label><input class="vh" type="radio" name="n">20</label>
          </div>
        </fieldset>

        <fieldset style="border: 0; margin: 0; padding: 0; max-width: 360px;">
          <legend class="q">Correção</legend>
          <div class="seg" style="grid-template-columns: repeat(2, minmax(0, 1fr));">
            <label><input class="vh" type="radio" name="c" checked>A cada questão</label>
            <label><input class="vh" type="radio" name="c">Só no fim</label>
          </div>
          <p style="margin: 8px 0 0; font-size: 13px; color: #617066; line-height: 1.45;">Vês logo se acertaste e porquê.</p>
        </fieldset>

        <details style="border-top: 1px solid #edf1ea; padding-top: 16px;">
          <summary style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #3d4a41; cursor: pointer;">Mais opções: tempo e tipo de questões</summary>
        </details>
      </div>

      <div style="display: flex; align-items: center; gap: 20px; margin-top: 32px; padding-top: 24px; border-top: 1px solid #edf1ea;">
        <a href="../prova/desktop.html" style="display: flex; align-items: center; justify-content: center; height: 52px; padding: 0 32px; border-radius: 14px; background: #1f5a2c; color: #ffffff; font-weight: 700; font-size: 16px; text-decoration: none;">Começar</a>
        <span style="font-size: 14px; color: #617066;">10 questões de Lei de Ohm, cerca de 20 minutos</span>
      </div>
    </div>
  </main>
</div>
</body>
</html>

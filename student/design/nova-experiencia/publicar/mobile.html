<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #121c15; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden;">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa39c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>

    <button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 20px; border: 0; border-top: 1px solid #eef0ec; background: transparent; text-align: left;">

    </button>

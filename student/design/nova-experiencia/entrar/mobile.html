<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar no Kixi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>

body{margin:0}
a{color:#1f5a2c}a:hover{color:#2a7a3c}
button{font:inherit;cursor:pointer}
.lbl{font-size:14px;font-weight:600;color:#23332a}
.inp{height:52px;border:1.5px solid #dde3da;border-radius:14px;padding:0 16px;font:inherit;font-size:16px;color:#121c15;background:#ffffff;box-sizing:border-box;width:100%}
.inp:focus{outline:none;border-color:#1f5a2c;box-shadow:0 0 0 3px rgba(31,90,44,.15)}
.back{display:flex;align-items:center;gap:6px;color:#5f6b63;text-decoration:none;font-size:14px;font-weight:600}

</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #121c15; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden; padding: 20px 24px 24px;">

  <a href="../inicio/mobile.html" class="back" aria-label="Voltar ao início"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Voltar ao início</a>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 24px;">
    <span style="display: flex; justify-content: center;" aria-hidden="true"><svg viewBox="0 0 24 20" width="36" height="30" shape-rendering="crispEdges"><path d="M12 0h1v1h-1zM10 1h3v1h-3zM8 2h5v1h-5zM8 3h5v1h-5zM8 4h5v1h-5zM8 5h5v1h-5zM8 6h5v1h-5zM8 7h5v1h-5zM8 8h5v1h-5zM8 9h6v1h-6zM7 10h7v1h-7zM7 11h8v1h-8zM6 12h10v1h-10zM6 13h11v1h-11zM5 14h14v1h-14zM4 15h18v1h-18zM3 16h21v1h-21zM3 17h4v1h-4zM14 17h9v1h-9zM1 18h2v1h-2zM17 18h5v1h-5zM19 19h1v1h-1z" fill="#1f5a2c"></path></svg></span>

    <div style="display: flex; flex-direction: column; gap: 6px; text-align: center;">
      <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em;">Entrar</h1>
      <span style="font-size: 15px; color: #5f6b63;">Usa o teu número de processo ou o teu email.</span>
    </div>

    <form style="display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label class="lbl" for="user">Utilizador ou email</label>
        <input class="inp" id="user" type="text" autocomplete="username" placeholder="ex.: 14662" value="14662">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label class="lbl" for="pass">Palavra-passe</label>
        <input class="inp" id="pass" type="password" autocomplete="current-password" value="segredo123">
      </div>
      <a href="../inicio/mobile.html" style="margin-top: 6px; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #1f5a2c; color: #ffffff; font-weight: 700; font-size: 16px; text-decoration: none;">Entrar</a>
    </form>

    <p style="margin: 0; text-align: center; font-size: 15px; color: #3d4a41;">Ainda não tens conta? <a href="../cadastro/mobile.html" style="font-weight: 700; text-decoration: none;">Criar conta</a></p>
  </div>
</div>
</body>
</html>

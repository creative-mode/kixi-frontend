<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta no Kixi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>

body{margin:0}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
a{color:#1f5a2c}a:hover{color:#2a7a3c}
button{font:inherit;cursor:pointer}
.lbl{font-size:14px;font-weight:600;color:#23332a}
.inp{height:52px;border:1.5px solid #dde3da;border-radius:14px;padding:0 16px;font:inherit;font-size:16px;color:#121c15;background:#ffffff;box-sizing:border-box;width:100%}
.inp:focus{outline:none;border-color:#1f5a2c;box-shadow:0 0 0 3px rgba(31,90,44,.15)}
.back{display:flex;align-items:center;gap:6px;color:#5f6b63;text-decoration:none;font-size:14px;font-weight:600}
.mut{font-size:13px;color:#5f6b63}

</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #121c15; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden;">

  <div style="padding: 20px 24px 0;"><a href="../entrar/mobile.html" class="back" aria-label="Voltar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Voltar</a></div>

  <main class="rola" style="flex: 1; min-height: 0; overflow-y: auto; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 20px), transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 20px), transparent 100%); padding: 10px 24px 28px; display: flex; flex-direction: column; gap: 22px;">

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em;">Cria a tua conta</h1>
      <span style="font-size: 15px; color: #5f6b63;">Leva menos de um minuto.</span>
    </div>

    <form style="display: flex; flex-direction: column; gap: 16px;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label class="lbl" for="firstName">Nome</label>
          <input class="inp" id="firstName" autocomplete="given-name" value="Ana">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label class="lbl" for="lastName">Apelido</label>
          <input class="inp" id="lastName" autocomplete="family-name" value="Kiala">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label class="lbl" for="username">Utilizador</label>
        <input class="inp" id="username" autocomplete="username" value="14662">
        <span class="mut">O número de processo ou o nome que preferires.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label class="lbl" for="email">Email</label>
        <input class="inp" id="email" type="email" autocomplete="email" value="ana.kiala@email.co">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label class="lbl" for="password">Palavra-passe</label>
        <input class="inp" id="password" type="password" autocomplete="new-password" value="segredoforte1">
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <span style="height: 6px; border-radius: 999px; background: #e9ebe7; overflow: hidden; display: block;"><span style="display: block; height: 100%; width: 75%; background: #1f5a2c; border-radius: 999px;"></span></span>
          <span class="mut">Boa</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label class="lbl" for="confirm">Repetir palavra-passe</label>
        <input class="inp" id="confirm" type="password" autocomplete="new-password" value="segredoforte1">
      </div>
      <a href="../onboarding/mobile.html" style="margin-top: 6px; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #1f5a2c; color: #ffffff; font-weight: 700; font-size: 16px; text-decoration: none;">Criar conta</a>
    </form>

    <p style="margin: 0; text-align: center; font-size: 15px; color: #3d4a41;">Já tens conta? <a href="../entrar/mobile.html" style="font-weight: 700; text-decoration: none;">Entrar</a></p>
  </main>
</div>
</body>
</html>

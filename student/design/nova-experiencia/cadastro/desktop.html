<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta no Kixi, computador</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>

body{margin:0;background:#ffffff}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
a{color:#1f5a2c}a:hover{color:#2a7a3c}
button{font:inherit;cursor:pointer}
.lbl{font-size:14px;font-weight:600;color:#23332a}
.inp{height:54px;border:1.5px solid #dde3da;border-radius:14px;padding:0 16px;font:inherit;font-size:16px;color:#121c15;background:#ffffff;box-sizing:border-box;width:100%}
.inp:focus{outline:none;border-color:#1f5a2c;box-shadow:0 0 0 3px rgba(31,90,44,.15)}
.back{display:flex;align-items:center;gap:6px;color:#5f6b63;text-decoration:none;font-size:14px;font-weight:600}
.mut{font-size:13px;color:#5f6b63}

</style>
</head>
<body>
<div style="box-sizing: border-box; min-height: 1000px; display: flex; flex-direction: column; background: #ffffff; color: #121c15; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 32px 48px 48px;">

  <a href="../inicio/desktop.html" class="back" aria-label="Voltar ao início"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Voltar ao início</a>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 0;">
    <div style="width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 24px;">
      <span style="display: flex; justify-content: center;" aria-hidden="true"><svg viewBox="0 0 24 20" width="36" height="30" shape-rendering="crispEdges"><path d="M12 0h1v1h-1zM10 1h3v1h-3zM8 2h5v1h-5zM8 3h5v1h-5zM8 4h5v1h-5zM8 5h5v1h-5zM8 6h5v1h-5zM8 7h5v1h-5zM8 8h5v1h-5zM8 9h6v1h-6zM7 10h7v1h-7zM7 11h8v1h-8zM6 12h10v1h-10zM6 13h11v1h-11zM5 14h14v1h-14zM4 15h18v1h-18zM3 16h21v1h-21zM3 17h4v1h-4zM14 17h9v1h-9zM1 18h2v1h-2zM17 18h5v1h-5zM19 19h1v1h-1z" fill="#1f5a2c"></path></svg></span>

      <div style="display: flex; flex-direction: column; gap: 6px; text-align: center;">
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em;">Cria a tua conta</h1>
        <span style="font-size: 15px; color: #5f6b63;">Leva menos de um minuto.</span>
      </div>

      <form style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label class="lbl" for="firstName">Nome</label>
            <input class="inp" id="firstName" autocomplete="given-name" value="Ana">
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label class="lbl" for="lastName">Apelido</label>
            <input class="inp" id="lastName" autocomplete="family-name" value="Kiala">
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label class="lbl" for="username">Utilizador</label>
          <input class="inp" id="username" autocomplete="username" value="14662">
          <span class="mut">O número de processo ou o nome que preferires.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label class="lbl" for="email">Email</label>
          <input class="inp" id="email" type="email" autocomplete="email" value="ana.kiala@email.co">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label class="lbl" for="password">Palavra-passe</label>
            <input class="inp" id="password" type="password" autocomplete="new-password" value="segredoforte1">
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label class="lbl" for="confirm">Repetir palavra-passe</label>
            <input class="inp" id="confirm" type="password" autocomplete="new-password" value="segredoforte1">
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px; margin-top: -6px;">
          <span style="height: 6px; border-radius: 999px; background: #e9ebe7; overflow: hidden; display: block;"><span style="display: block; height: 100%; width: 75%; background: #1f5a2c; border-radius: 999px;"></span></span>
          <span class="mut">Força da palavra-passe: Boa</span>
        </div>
        <a href="../onboarding/desktop.html" style="margin-top: 8px; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #1f5a2c; color: #ffffff; font-weight: 700; font-size: 16px; text-decoration: none;">Criar conta</a>
      </form>

      <p style="margin: 0; text-align: center; font-size: 15px; color: #3d4a41;">Já tens conta? <a href="../entrar/desktop.html" style="font-weight: 700; text-decoration: none;">Entrar</a></p>
    </div>
  </div>
</div>
</body>
</html>
